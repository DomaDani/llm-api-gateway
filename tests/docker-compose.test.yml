services:
  init-db:
    environment:
      RESET_DB: "true"
      CREATE_MOCK_DATA: "true"
  gateway:
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 6
  mock-upstream:
    image: ${MOCK_UPSTREAM_IMAGE:-llm-api-mock-upstream:latest}
    build:
      context: ./
      dockerfile: tests/tools/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health ||exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    ports:
      - "8081:8081"
