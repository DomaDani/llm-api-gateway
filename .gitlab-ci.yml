stages:
  - build
  - compose

variables:
  DATABASE_URL: postgresql+asyncpg://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/postgres

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: ["/busybox/sh", "-c"]
  script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "auth": "$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64 | tr -d '\n')"
          }
        }
      }
      EOF
    - |
      /kaniko/executor \
      --context $CI_PROJECT_DIR \
      --dockerfile gateway/Dockerfile \
      --destination $CI_REGISTRY_IMAGE:gateway-$IMAGE_TAG \
      --cache=true

    - |
      /kaniko/executor \
      --context $CI_PROJECT_DIR \
      --dockerfile postgreSQL/Dockerfile \
      --destination $CI_REGISTRY_IMAGE:init-db-$IMAGE_TAG \
      --cache=true


compose:
  stage: compose
  image:
    name: docker:29.3.0
  services:
    - docker:29.3.0-dind
  script: |
    cat > .env <<ENV
    POSTGRES_USER=$POSTGRES_USER
    POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    DATABASE_URL=$DATABASE_URL
    
    TARGET_URL=$TARGET_URL
    TARGET_KEY=$TARGET_KEY
    ENV

    cat > ci.override.yml <<'YAML'
    services:
      init-db:
        environment:
          RESET_DB: "true"
          CREATE_MOCK_DATA: "true"
    YAML

    docker-compose -f docker-compose.yml -f ci.override.yml up -d --build
    docker-compose -f docker-compose.yml -f ci.override.yml down -v