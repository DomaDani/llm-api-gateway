variables:
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

stages:
  - build
  - startup

build-images:
  stage: build
  image: 
    name: alpine:3.21
    entrypoint: [""]
  variables:
    KANIKO_VERSION: v1.24.0
    KANIKO_DIGEST: sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
  script:
    - apk add --no-cache bash curl tar ca-certificates coreutils

    - mkdir -p /kaniko /kaniko/.docker /workspace

    - KANIKO_DIGEST_SHA="${KANIKO_DIGEST#sha256:}"
    - curl -fsSL -o /kaniko/executor "https://github.com/GoogleContainerTools/kaniko/releases/download/${KANIKO_VERSION}/executor"

    - echo "${KANIKO_DIGEST_SHA}  /kaniko/executor" > /kaniko/executor.sha256
    - if ! sha256sum -c /kaniko/executor.sha256; then echo "kaniko checksum mismatch"; exit 1; fi
    
    - chmod +x /kaniko/executor

    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s' "gitlab-ci-token:${CI_JOB_TOKEN}" | base64)" > /kaniko/.docker/config.json

    - /kaniko/executor --context=dir:///workspace --dockerfile=/workspace/gateway/Dockerfile --destination=$CI_REGISTRY_IMAGE:gateway-$IMAGE_TAG --cache=true
    - /kaniko/executor --context=dir:///workspace --dockerfile=/workspace/postgreSQL/Dockerfile --destination=$CI_REGISTRY_IMAGE:init-db-$IMAGE_TAG --cache=true

    - shred -u /kaniko/.docker/config.json || rm -f /kaniko/.docker/config.json
  only:
    - branches

startup-containers:
  stage: startup
  image: docker/compose:5.1.1
  script: |
    cat > ci.override.yml <<'YAML'
    services:
      init-db:
        environment:
          RESET_DB: "true"
          CREATE_MOCK_DATA: "true"
    YAML

    docker compose -f docker-compose.yml -f ci.override.yml up -d --build

    INIT_ID=$(docker compose -f docker-compose.yml -f ci.override.yml ps -q init-db) || true
    if [ -n "$INIT_ID" ]; then
      timeout=300; elapsed=0
      while [ "$(docker inspect -f '{{.State.Running}}' "$INIT_ID")" = "true" ] && [ $elapsed -lt $timeout ]; do
        sleep 1; elapsed=$((elapsed+1))
      done
      EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$INIT_ID")
      if [ "$EXIT_CODE" -ne 0 ]; then
        docker compose -f docker-compose.yml -f ci.override.yml logs init-db --tail=300
        docker compose -f docker-compose.yml -f ci.override.yml down -v
        rm -f ci.override.yml
        exit $EXIT_CODE
      fi
    fi

    elapsed=0
    until curl -sSf http://localhost:8000/health || [ $elapsed -ge 120 ]; do
      sleep 1
      elapsed=$((elapsed+2))
    done
    if ! curl -sSf http://localhost:8000/health; then
      docker compose -f docker-compose.yml -f ci.override.yml logs gateway --tail=300
      docker compose -f docker-compose.yml -f ci.override.yml down -v
      rm -f ci.override.yml
      exit 1
    fi

    docker compose -f docker-compose.yml -f ci.override.yml ps
    docker compose -f docker-compose.yml -f ci.override.yml logs --tail=200
    docker compose -f docker-compose.yml -f ci.override.yml down -v
    rm -f ci.override.yml
  only:
    - branches