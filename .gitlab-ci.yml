stages:
  - compose

compose:
  stage: compose
  image:
    name: docker/compose:latest
  services:
    - docker:19.03.12-dind
  script: |
    cat > ci.override.yml <<'YAML'
    services:
      init-db:
        environment:
          RESET_DB: "true"
          CREATE_MOCK_DATA: "true"
    YAML

    docker compose -f docker-compose.yml -f ci.override.yml up -d --build