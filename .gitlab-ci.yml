stages:
  - docker
  - tests

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - when: never

variables:
  DATABASE_URL: postgresql+asyncpg://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/postgres
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: ["/busybox/sh", "-c"]
  script:
    - mkdir -p /kaniko/.docker
    - |
      # Set up kaniko authentication
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "auth": "$(echo -n $CI_JOB_USER:$CI_JOB_PASSWORD | base64 | tr -d '\n')"
          }
        }
      }
      EOF
    - |
      # Build & push gateway image
      /kaniko/executor \
      --context $CI_PROJECT_DIR \
      --dockerfile gateway/Dockerfile \
      --destination $CI_REGISTRY_IMAGE:gateway-$IMAGE_TAG \
      --cache=true

    - |
      # Build & push init-db image
      /kaniko/executor \
      --context $CI_PROJECT_DIR \
      --dockerfile postgreSQL/Dockerfile \
      --destination $CI_REGISTRY_IMAGE:init-db-$IMAGE_TAG \
      --cache=true

    - |
      # Build & push mock-upstream image
      /kaniko/executor \
      --context $CI_PROJECT_DIR \
      --dockerfile tests/tools/Dockerfile \
      --destination $CI_REGISTRY_IMAGE:mock-upstream-$IMAGE_TAG \
      --cache=true

    - |
      # Build & push dashboard-backend image
      /kaniko/executor \
      --context $CI_PROJECT_DIR \
      --dockerfile dashboard/backend/Dockerfile \
      --destination $CI_REGISTRY_IMAGE:dashboard-backend-$IMAGE_TAG \
      --cache=true

    - |
      # Build & push dashboard-frontend image
      /kaniko/executor \
      --context $CI_PROJECT_DIR \
      --dockerfile dashboard/frontend/Dockerfile \
      --destination $CI_REGISTRY_IMAGE:dashboard-frontend-$IMAGE_TAG \
      --cache=true

    - |
      # Write artifact
      echo "GATEWAY_IMAGE=$CI_REGISTRY_IMAGE:gateway-$IMAGE_TAG" > images.env
      echo "INIT_DB_IMAGE=$CI_REGISTRY_IMAGE:init-db-$IMAGE_TAG" >> images.env
      echo "MOCK_UPSTREAM_IMAGE=$CI_REGISTRY_IMAGE:mock-upstream-$IMAGE_TAG" >> images.env
      echo "DASHBOARD_BACKEND_IMAGE=$CI_REGISTRY_IMAGE:dashboard-backend-$IMAGE_TAG" >> images.env
      echo "DASHBOARD_FRONTEND_IMAGE=$CI_REGISTRY_IMAGE:dashboard-frontend-$IMAGE_TAG" >> images.env

  artifacts:
    paths:
      - images.env
    expire_in: 1h


compose:
  stage: docker
  image:
    name: docker:24.0.9
  services:
    - docker:24.0.9-dind
  tags:
    - local
  needs:
    - job: build
      artifacts: true
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  script:
    - |
      # Write .env file
      cat > .env <<ENV
      POSTGRES_USER=$POSTGRES_USER
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      DATABASE_URL=$DATABASE_URL
      
      TARGET_URL=$TARGET_URL
      TARGET_KEY=$TARGET_KEY
      ADMINISTRATOR_PASSWORD=$ADMINISTRATOR_PASSWORD
      LOGIN_SECRET_KEY=$LOGIN_SECRET_KEY
      ENV

    - |
      # Update ci.yml settings
      cat > ci.override.yml <<'YAML'
      services:
        init-db:
          environment:
            RESET_DB: "true"
            CREATE_MOCK_DATA: "true"
      YAML

    - apk add --no-cache curl

    - printf '%s' "$CI_JOB_PASSWORD" | docker login "$CI_REGISTRY" -u $CI_JOB_USER --password-stdin
    - if [ -f images.env ]; then cat images.env >> .env; fi

    - docker-compose -f docker-compose.yml -f ci.override.yml pull
    - docker-compose -f docker-compose.yml -f ci.override.yml up -d --no-build
    
    - |
      # Wait for init-db to bootsrap db, verify success
      INIT_ID=$(docker-compose -f docker-compose.yml -f ci.override.yml ps -q init-db) || true
      if [ -n "$INIT_ID" ]; then
        timeout=300; elapsed=0
        while [ "$(docker inspect -f '{{.State.Running}}' "$INIT_ID")" = "true" ] && [ $elapsed -lt $timeout ]; do
          sleep 1; elapsed=$((elapsed+1))
        done
        EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$INIT_ID")
        if [ "$EXIT_CODE" -ne 0 ]; then
          docker-compose -f docker-compose.yml -f ci.override.yml logs init-db --tail=300
          docker-compose -f docker-compose.yml -f ci.override.yml down -v
          rm -f ci.override.yml
          exit $EXIT_CODE
        fi
      fi

    - | 
      # Perform gateway health check
      elapsed=0
      until curl -sSf http://docker:8000/health || [ $elapsed -ge 120 ]; do
        sleep 1
        elapsed=$((elapsed+1))
      done
      if ! curl -sSf http://docker:8000/health; then
        docker-compose -f docker-compose.yml -f ci.override.yml logs gateway --tail=300
        docker-compose -f docker-compose.yml -f ci.override.yml down -v
        rm -f ci.override.yml
        exit 1
      fi

    - |
      # Perform dashboard-backend health check
      elapsed=0
      until curl -sSf http://docker:8080/health || [ $elapsed -ge 120 ]; do
        sleep 1
        elapsed=$((elapsed+1))
      done
      if ! curl -sSf http://docker:8080/health; then
        docker-compose -f docker-compose.yml -f ci.override.yml logs dashboard-backend --tail=300
        docker-compose -f docker-compose.yml -f ci.override.yml down -v
        rm -f ci.override.yml
        exit 1
      fi

    - |
      # Perform dashboard-frontend health check
      elapsed=0
      until curl -sSf http://docker:5173 || [ $elapsed -ge 120 ]; do
        sleep 1
        elapsed=$((elapsed+1))
      done
      if ! curl -sSf http://docker:5173; then
        docker-compose -f docker-compose.yml -f ci.override.yml logs dashboard-frontend --tail=300
        docker-compose -f docker-compose.yml -f ci.override.yml down -v
        rm -f ci.override.yml
        exit 1
      fi

    - docker-compose -f docker-compose.yml -f ci.override.yml ps
    - docker-compose -f docker-compose.yml -f ci.override.yml logs --tail=200
    - docker-compose -f docker-compose.yml -f ci.override.yml down -v
    - rm -f ci.override.yml
    - rm -f .env


integration:
  stage: tests
  image:
    name: python:3.12.12-alpine
  services:
    - docker:24.0.9-dind
  tags:
    - local
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    DOCKER_API_VERSION: "1.43"
    TARGET_URL: http://mock-upstream:8081/v1
    TARGET_KEY: anykey
    BASE_URL: http://docker:8000
  script:
    - |
      # Write .env file
      cat > .env <<ENV
      POSTGRES_USER=$POSTGRES_USER
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      DATABASE_URL=$DATABASE_URL
      
      TARGET_URL=$TARGET_URL
      TARGET_KEY=$TARGET_KEY
      ADMINISTRATOR_PASSWORD=$ADMINISTRATOR_PASSWORD
      LOGIN_SECRET_KEY=$LOGIN_SECRET_KEY
      ENV

    - apk add --no-cache docker docker-compose curl
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install -r tests/requirements.txt & PIP_PID=$!

    - printf '%s' "$CI_JOB_PASSWORD" | docker login "$CI_REGISTRY" -u $CI_JOB_USER --password-stdin
    - if [ -f images.env ]; then cat images.env >> .env; fi

    - docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml pull
    - docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml up -d --no-build

    - |
      # Wait for init-db to bootstrap db, verify success
      INIT_ID=$(docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml ps -q init-db) || true
      if [ -n "$INIT_ID" ]; then
        timeout=300; elapsed=0
        while [ "$(docker inspect -f '{{.State.Running}}' "$INIT_ID")" = "true" ] && [ $elapsed -lt $timeout ]; do
          sleep 1; elapsed=$((elapsed+1))
        done
        EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$INIT_ID")
        if [ "$EXIT_CODE" -ne 0 ]; then
          docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml logs init-db --tail=300
          docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml down -v
          exit $EXIT_CODE
        fi
      fi

    - |
      # Wait for gateway to be healthy
      SERVICE=gateway
      ID=$(docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml ps -q "$SERVICE") || true
      if [ -z "$ID" ]; then echo "$SERVICE: no container"; exit 1; fi

      timeout=120; elapsed=0
      while [ "$(docker inspect -f '{{.State.Health.Status}}' "$ID" 2>/dev/null || echo unknown)" != "healthy" ] && [ $elapsed -lt $timeout ]; do
        sleep 1
        elapsed=$((elapsed+1))
      done

      if [ "$(docker inspect -f '{{.State.Health.Status}}' "$ID" 2>/dev/null || echo unknown)" != "healthy" ]; then
        docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml logs gateway --tail=200
        exit 1
      fi


    - |
      # Wait for mock-upstream to be healthy
      SERVICE=mock-upstream
      ID=$(docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml ps -q "$SERVICE") || true
      if [ -z "$ID" ]; then echo "$SERVICE: no container"; exit 1; fi

      timeout=120; elapsed=0
      while [ "$(docker inspect -f '{{.State.Health.Status}}' "$ID" 2>/dev/null || echo unknown)" != "healthy" ] && [ $elapsed -lt $timeout ]; do
        sleep 1
        elapsed=$((elapsed+1))
      done

      if [ "$(docker inspect -f '{{.State.Health.Status}}' "$ID" 2>/dev/null || echo unknown)" != "healthy" ]; then
        docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml logs mock-upstream --tail=200
        exit 1
      fi

    - |
      # Debug: dump init-db logs, inspect init-db env, and verify seeded API keys
      docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml logs init-db --tail=500 || true

      INIT_ID=$(docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml ps -q init-db) || true
      if [ -n "$INIT_ID" ]; then
        docker inspect -f '{{range $k,$v := .Config.Env}}{{println $v}}{{end}}' "$INIT_ID" \
          | grep -E 'CREATE_MOCK_DATA|DATABASE_URL|POSTGRES_USER' || true
      fi

      # Verify DB contains API keys (prints table rows)
      docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml exec -T db \
        psql -U "$POSTGRES_USER" -d postgres -c "select fingerprint, status from api_keys order by id desc limit 20;" || true

    - sleep 5

    - wait $PIP_PID

    - |
      # Run tests, capture exit code
      PYTEST_EXIT=0
      python -m pytest -vv tests/integration || PYTEST_EXIT=$?


    - docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml logs gateway --tail=200 || true
    - docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml logs mock-upstream --tail=200 || true

    - docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml ps || true
    - docker-compose -f docker-compose.yml -f tests/docker-compose.test.yml down -v || true
    - kill MOCK_PID || true
    - rm -f .env

    - exit $PYTEST_EXIT

unit:
  stage: tests
  image:
    name: python:3.12.12-alpine
  script:
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install -r gateway/requirements.txt -r dashboard/backend/requirements.txt -r tests/requirements.txt
    - python -m pytest -vv tests/unit