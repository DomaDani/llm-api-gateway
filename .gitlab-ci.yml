stages:
  - build
  - compose

variables:
  DATABASE_URL: postgresql+asyncpg://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/postgres
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: ["/busybox/sh", "-c"]
  script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "$CI_REGISTRY": {
            "auth": "$(echo -n $CI_JOB_USER:$CI_JOB_PASSWORD | base64 | tr -d '\n')"
          }
        }
      }
      EOF
    - |
      /kaniko/executor \
      --context $CI_PROJECT_DIR \
      --dockerfile gateway/Dockerfile \
      --destination $CI_REGISTRY_IMAGE:gateway-$IMAGE_TAG \
      --cache=true

    - |
      /kaniko/executor \
      --context $CI_PROJECT_DIR \
      --dockerfile postgreSQL/Dockerfile \
      --destination $CI_REGISTRY_IMAGE:init-db-$IMAGE_TAG \
      --cache=true

    - |
      echo "GATEWAY_IMAGE=$CI_REGISTRY_IMAGE:gateway-$IMAGE_TAG" > images.env
      echo "INIT_DB_IMAGE=$CI_REGISTRY_IMAGE:init-db-$IMAGE_TAG" >> images.env

  artifacts:
    paths:
      - images.env
    expire_in: 1h


compose:
  stage: compose
  image:
    name: docker:24.0.9
  services:
    - docker:24.0.9-dind
  tags:
    - local
  dependencies:
    - build
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  script:
    - |
      cat > .env <<ENV
      POSTGRES_USER=$POSTGRES_USER
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      DATABASE_URL=$DATABASE_URL
      
      TARGET_URL=$TARGET_URL
      TARGET_KEY=$TARGET_KEY
      ENV

    - |
      cat > ci.override.yml <<'YAML'
      services:
        init-db:
          environment:
            RESET_DB: "true"
            CREATE_MOCK_DATA: "true"
      YAML

    - apk add --no-cache curl

    - printf '%s' "$CI_JOB_PASSWORD" | docker login "$CI_REGISTRY" -u $CI_JOB_USER --password-stdin
    - if [ -f images.env ]; then cat images.env >> .env; fi

    - docker-compose pull || true
    - docker-compose -f docker-compose.yml -f ci.override.yml up -d --no-build
    
    - |
      INIT_ID=$(docker-compose -f docker-compose.yml -f ci.override.yml ps -q init-db) || true
      if [ -n "$INIT_ID" ]; then
        timeout=300; elapsed=0
        while [ "$(docker inspect -f '{{.State.Running}}' "$INIT_ID")" = "true" ] && [ $elapsed -lt $timeout ]; do
          sleep 1; elapsed=$((elapsed+1))
        done
        EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$INIT_ID")
        if [ "$EXIT_CODE" -ne 0 ]; then
          docker-compose -f docker-compose.yml -f ci.override.yml logs init-db --tail=300
          docker-compose -f docker-compose.yml -f ci.override.yml down -v
          rm -f ci.override.yml
          exit $EXIT_CODE
        fi
      fi

    - |
      elapsed=0
      until curl -sSf http://docker:8000/health || [ $elapsed -ge 120 ]; do
        sleep 1
        elapsed=$((elapsed+2))
      done
      if ! curl -sSf http://docker:8000/health; then
        docker-compose -f docker-compose.yml -f ci.override.yml logs gateway --tail=300
        docker-compose -f docker-compose.yml -f ci.override.yml down -v
        rm -f ci.override.yml
        exit 1
      fi

    - docker-compose -f docker-compose.yml -f ci.override.yml ps
    - docker-compose -f docker-compose.yml -f ci.override.yml logs --tail=200
    - docker-compose -f docker-compose.yml -f ci.override.yml down -v
    - rm -f ci.override.yml
    - rm -f .env